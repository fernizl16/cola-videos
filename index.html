<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cola de vídeos</title>
<style>
:root{--bg:#0f0f14;--card:#191920;--card2:#22222b;--line:#2e2e3a;--tx:#f2f2f5;--mut:#9a9aab;--acc:#7c5cff;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(15,15,20,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 14px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px}
.accs{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px 0}
.accs::-webkit-scrollbar{display:none}
.chip{--c:var(--acc);white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--card2);border:1.5px solid transparent;font-weight:600;font-size:15px}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent)}
.chip::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}
.icon{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:18px;flex:none}
.icon.spin span{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;margin-top:10px}
.tab{flex:1;padding:10px 0 12px;color:var(--mut);font-weight:600;font-size:15px;border-bottom:2.5px solid transparent}
.tab.on{color:var(--tx);border-color:var(--acc)}
.tab small{opacity:.7;font-weight:500}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:20px;padding:14px;border:1px solid var(--line)}
.cover{position:relative;border-radius:14px;overflow:hidden;background:var(--card2);aspect-ratio:9/16;max-height:52vh;margin:0 auto;display:grid;place-items:center}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.play{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.7);font-size:30px;color:#fff;display:grid;place-items:center;padding-left:6px}
.cover .prog{position:absolute;left:12px;right:12px;bottom:12px;height:40px}
.noimg{color:var(--mut);font-size:14px}
.badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.65);padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600}
h2{margin:14px 0 2px;font-size:20px}
.meta{color:var(--mut);font-size:13px}
.notas{background:var(--card2);padding:10px 12px;border-radius:12px;font-size:14px;margin:10px 0 0;white-space:pre-wrap}
.err{color:var(--bad);font-size:14px}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 14px;border-radius:14px;background:var(--card2);font-weight:600;font-size:15px;border:1px solid var(--line);width:100%}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card2));border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.btn.ghost{background:transparent}
.btn.small{padding:9px 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
.prog{position:relative;height:48px;border-radius:14px;background:var(--card2);overflow:hidden;display:grid;place-items:center;font-weight:600;font-size:14px}
.prog .bar{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--acc) 55%,transparent);transition:width .2s}
.prog span{position:relative}
.tip{color:var(--mut);font-size:13px;margin:10px 2px 0}
.plat{--pc:var(--acc);margin-top:14px;border-radius:16px;border:1px solid var(--line);border-left:4px solid var(--pc);padding:12px;background:var(--card2)}
.plat.ok{opacity:.8}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.okt{color:var(--ok);font-size:13px;font-weight:600}
.pie{white-space:pre-wrap;word-break:break-word;font-size:14.5px;background:var(--bg);border-radius:12px;padding:10px 12px;max-height:220px;overflow:auto;user-select:text;-webkit-user-select:text}
.row{display:flex;gap:8px;margin-top:10px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;width:100%}
.th{width:54px;height:96px;border-radius:10px;background:var(--card2);overflow:hidden;flex:none}
.th img{width:100%;height:100%;object-fit:cover}
.it{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.it b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{color:var(--mut)}
.pls{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.pl{--pc:var(--acc);font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--pc) 60%,transparent);color:var(--mut)}
.pl.on{background:color-mix(in srgb,var(--pc) 25%,transparent);color:var(--tx)}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.empty .big{font-size:46px;margin-bottom:6px}
.empty h3{color:var(--tx);margin:4px 0 8px}
.more{color:var(--mut);text-align:center;font-size:14px;margin-top:14px}
.back{margin-bottom:10px;color:var(--mut);font-weight:600;padding:6px 0}
.errbox{background:color-mix(in srgb,var(--bad) 14%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);padding:14px;border-radius:16px;margin-bottom:14px}
.errbox p{margin:0 0 10px;word-break:break-word}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:#2b2b36;border:1px solid var(--line);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;transition:.25s;z-index:20;max-width:90vw;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--bad)}
dialog{border:0;padding:0;background:var(--bg);color:var(--tx);width:100%;max-width:560px;max-height:100dvh;height:100dvh;margin:0 auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:calc(14px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));overflow:auto;height:100%}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dh h3{margin:0;font-size:20px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.sec h4{margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:16px}
.help{font-size:12.5px;color:var(--mut);margin-top:4px}
.accrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.accrow:last-child{border-bottom:0}
.accrow .dot{width:12px;height:12px;border-radius:50%;flex:none}
.accrow .nm{flex:1;min-width:0}
.accrow .nm small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colors{display:flex;gap:10px;margin-top:6px}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:#fff}
.msg{font-size:14px;margin-top:10px;white-space:pre-wrap}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.spinner{display:grid;place-items:center;padding:60px 0;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="accs" id="accs"></div>
    <button class="icon" id="btnRefresh" data-act="refresh" aria-label="Actualizar"><span>⟳</span></button>
    <button class="icon" data-act="settings" aria-label="Ajustes">⚙️</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<div id="toast"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
'use strict';
/* =================== Configuración y utilidades =================== */
const API = 'https://api.github.com';
const PLAT = { instagram: { n: 'Instagram', c: '#e1306c' }, tiktok: { n: 'TikTok', c: '#25d0e6' } };
const COLORS = ['#7c5cff', '#ff8a3d', '#22c55e', '#e1306c', '#0ea5e9', '#eab308'];
const VID_EXT = /\.(mp4|mov|m4v|webm)$/i, IMG_EXT = /\.(jpe?g|png|webp)$/i;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mb = b => b ? (b / 1048576).toFixed(b > 10485760 ? 0 : 1) + ' MB' : '';
const cssid = k => k.replace(/[^a-z0-9]/gi, '_');
const fecha = iso => { try { return new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch { return iso; } };
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() || 'cuenta';
const mime = p => ({ mp4: 'video/mp4', m4v: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp' }[p.split('.').pop().toLowerCase()] || 'application/octet-stream');
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
function b64(s) { const by = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < by.length; i += 8192) bin += String.fromCharCode.apply(null, by.subarray(i, i + 8192)); return btoa(bin); }
function unb64(s) { const bin = atob(String(s).replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
async function pool(items, n, fn) { let i = 0; await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const it = items[i++]; await fn(it); } })); }

let toastT;
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', bad ? 4500 : 2200); }

/* =================== Estado =================== */
let accounts = ls.get('cv.accounts', []);
let cur = ls.get('cv.current', accounts[0]?.id || null);
if (!accounts.find(a => a.id === cur)) cur = accounts[0]?.id || null;
const S = { videos: [], estado: { videos: {} }, loading: false, error: null, tab: 'next', detail: null, local: new Set(), progress: {}, busy: {}, loadedFor: null };
const mem = new Map();        // clave -> {blob, name}  (copias locales cargadas en memoria)
const memLoading = new Set();
const vurls = new Map();      // clave -> objectURL para el reproductor
function vurl(k) { let u = vurls.get(k); if (!u) { u = URL.createObjectURL(mem.get(k).blob); vurls.set(k, u); } return u; }
function dropMem(k) { mem.delete(k); const u = vurls.get(k); if (u) { URL.revokeObjectURL(u); vurls.delete(k); } }
const thumbs = new Map();     // sha -> objectURL | 'loading' | 'error'
const thumbQ = []; let thumbActive = 0;
let tcache = ls.get('cv.tcache', {});   // sha -> texto (info.json / pie.txt). Los blobs de git son inmutables.
let lastRefresh = 0;

const acc = () => accounts.find(a => a.id === cur) || null;
const branch = a => (a.rama || 'main').trim();
const base = a => (a.carpeta || '').trim().replace(/^\/+|\/+$/g, '');
const join = (...p) => p.filter(Boolean).join('/');
const rp = a => `/repos/${encodeURIComponent(a.owner.trim())}/${encodeURIComponent(a.repo.trim())}`;
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const estadoPath = a => join(base(a), 'estado.json');
const vk = (a, v) => `${a.id}|${v.id}|video`;
const pk = (a, v) => `${a.id}|${v.id}|portada`;
const done = v => v.plataformas.every(p => S.estado.videos[v.id]?.[p]);
const findV = id => S.videos.find(v => v.id === id);

/* =================== IndexedDB (copias locales dentro de la app) =================== */
let dbP;
const db = () => dbP ||= new Promise((res, rej) => { const r = indexedDB.open('cola-videos', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function idb(mode, fn) { const d = await db(); return new Promise((res, rej) => { const tx = d.transaction('files', mode); const rq = fn(tx.objectStore('files')); tx.oncomplete = () => res(rq ? rq.result : undefined); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); }
const idbGet = k => idb('readonly', s => s.get(k));
const idbPut = (k, v) => idb('readwrite', s => s.put(v, k));
const idbDel = k => idb('readwrite', s => s.delete(k));
const idbKeys = () => idb('readonly', s => s.getAllKeys());

/* =================== GitHub =================== */
async function gh(a, path, opts = {}) {
  const { accept, headers, ...rest } = opts;
  const r = await fetch(API + path, {
    ...rest,
    headers: { 'Authorization': 'Bearer ' + a.token.trim(), 'X-GitHub-Api-Version': '2022-11-28', 'Accept': accept || 'application/vnd.github+json', ...(headers || {}) }
  });
  if (!r.ok) {
    let m = ''; try { m = (await r.json()).message; } catch {}
    const hint = r.status === 401 ? ' (token incorrecto o caducado)' : r.status === 404 ? ' (no encuentro el repo/rama, o el token no tiene acceso)' : r.status === 403 ? ' (sin permiso o límite de GitHub alcanzado)' : '';
    const e = new Error(`GitHub ${r.status}: ${m || r.statusText}${hint}`); e.status = r.status; throw e;
  }
  return r;
}
const rawBlob = (a, sha) => gh(a, `${rp(a)}/git/blobs/${sha}`, { accept: 'application/vnd.github.raw+json' });

let tSave;
function saveT() { clearTimeout(tSave); tSave = setTimeout(() => { const ks = Object.keys(tcache); if (ks.length > 600) ks.slice(0, ks.length - 600).forEach(k => delete tcache[k]); ls.set('cv.tcache', tcache); }, 400); }
async function cachedText(a, e) {
  if (tcache[e.sha] != null) return tcache[e.sha];
  const t = await (await rawBlob(a, e.sha)).text();
  tcache[e.sha] = t; saveT(); return t;
}

async function loadVideos(a) {
  const t = await (await gh(a, `${rp(a)}/git/trees/${encodeURIComponent(branch(a))}?recursive=1`, { cache: 'no-store' })).json();
  const pre = join(base(a), 'videos') + '/';
  const by = {};
  for (const e of t.tree || []) {
    if (e.type !== 'blob' || !e.path.startsWith(pre)) continue;
    const parts = e.path.slice(pre.length).split('/');
    if (parts.length !== 2) continue;
    const [id, f] = parts;
    (by[id] ||= { id, f: {} }).f[f.toLowerCase()] = e;
  }
  const list = Object.values(by).map(o => {
    const names = Object.keys(o.f);
    const vid = names.find(n => VID_EXT.test(n));
    if (!vid) return null;
    const img = names.find(n => /^(portada|cover)\./.test(n) && IMG_EXT.test(n)) || names.find(n => IMG_EXT.test(n));
    return { id: o.id, video: o.f[vid], portada: img ? o.f[img] : null, _f: o.f };
  }).filter(Boolean);

  await pool(list, 6, async v => {
    let info = {};
    const f = v._f;
    try {
      if (f['info.json']) info = JSON.parse(await cachedText(a, f['info.json']));
    } catch (e) { info = { _err: e instanceof SyntaxError ? 'info.json no es un JSON válido' : 'No pude leer info.json: ' + e.message }; }
    for (const [file, key] of [['pie.txt', 'pie'], ['pie_instagram.txt', 'pie_instagram'], ['pie_tiktok.txt', 'pie_tiktok']]) {
      if (f[file] && !info[key]) { try { info[key] = await cachedText(a, f[file]); } catch {} }
    }
    let plats = Array.isArray(info.plataformas) ? info.plataformas.map(p => String(p).toLowerCase().trim()).filter(p => PLAT[p]) : [];
    if (!plats.length) plats = ['instagram', 'tiktok'];
    v.plataformas = plats;
    v.titulo = info.titulo || v.id;
    v.orden = info.orden != null && info.orden !== '' && isFinite(+info.orden) ? +info.orden : null;
    v.creado = info.creado || null;
    v.notas = info.notas || '';
    v.err = info._err || '';
    v.pies = {};
    for (const p of plats) v.pies[p] = (info.pies && info.pies[p]) || info['pie_' + p] || info.pie || '';
    delete v._f;
  });
  list.sort((x, y) => ((x.orden ?? Infinity) - (y.orden ?? Infinity)) || x.id.localeCompare(y.id, 'es', { numeric: true }));
  if (t.truncated) toast('Aviso: el repo es enorme y GitHub no devolvió todos los archivos', true);
  return list;
}

async function getEstado(a) {
  try {
    const j = await (await gh(a, `${rp(a)}/contents/${encPath(estadoPath(a))}?ref=${encodeURIComponent(branch(a))}`, { cache: 'no-store' })).json();
    let data; try { data = JSON.parse(unb64(j.content)); } catch { data = {}; }
    if (!data || typeof data !== 'object') data = {};
    if (!data.videos || typeof data.videos !== 'object') data.videos = {};
    return { sha: j.sha, data };
  } catch (e) {
    if (e.status === 404) return { sha: null, data: { videos: {} } };
    throw e;
  }
}

/* =================== Acciones =================== */
async function refresh() {
  const a = acc(); S.error = null;
  if (!a) { S.videos = []; render(); return; }
  const id = a.id;
  S.loading = true; render();
  try {
    const [videos, est] = await Promise.all([loadVideos(a), getEstado(a)]);
    if (cur !== id) return;
    S.videos = videos; S.estado = est.data; S.loadedFor = id;
    S.local = new Set(await idbKeys());
    lastRefresh = Date.now();
  } catch (e) {
    if (cur !== id) return;
    S.error = e.message;
  }
  S.loading = false; render();
}

function switchAcc(id) {
  if (id === cur) return;
  cur = id; ls.set('cv.current', cur);
  S.videos = []; S.estado = { videos: {} }; S.detail = null; S.tab = 'next'; S.loadedFor = null;
  refresh();
}

async function loadMem(k) {
  if (mem.has(k) || memLoading.has(k)) return;
  memLoading.add(k);
  try { const r = await idbGet(k); if (r) mem.set(k, r); else S.local.delete(k); } catch {}
  memLoading.delete(k); scheduleRender();
}

// guardar=true: se queda en el móvil (dentro de la app). guardar=false: solo para verlo ahora (en memoria).
async function descargar(v, guardar = true) {
  const a = acc(); const k = vk(a, v);
  if (S.progress[k] != null) return;
  const pre = slug(a.nombre) + '_' + slug(v.id);
  let m = mem.get(k);
  if (!m) { S.progress[k] = 0; S.progMode = guardar ? 'dl' : 'ver'; render(); }
  if (guardar) { try { if (navigator.storage?.persist) navigator.storage.persist(); } catch {} }
  try {
    if (!m) {
      const r = await rawBlob(a, v.video.sha);
      const total = v.video.size || +r.headers.get('content-length') || 0;
      let blob;
      if (r.body && r.body.getReader && total) {
        const rd = r.body.getReader(); const ch = []; let got = 0, last = 0;
        for (;;) {
          const { done: fin, value } = await rd.read();
          if (fin) break;
          ch.push(value); got += value.length;
          const pc = Math.min(got / total, 1);
          if (pc - last > 0.01) { last = pc; S.progress[k] = pc; updProgress(k, pc); }
        }
        blob = new Blob(ch, { type: mime(v.video.path) });
      } else {
        blob = new Blob([await r.blob()], { type: mime(v.video.path) });
      }
      m = { blob, name: pre + '.' + v.video.path.split('.').pop().toLowerCase(), temp: true };
      // solo se mantiene en memoria una vista previa a la vez
      for (const [kk, x] of [...mem]) if (x.temp && kk !== k) dropMem(kk);
      mem.set(k, m);
    }
    if (guardar) {
      await idbPut(k, { blob: m.blob, name: m.name }); m.temp = false; S.local.add(k);
      if (v.portada) {
        const pb = new Blob([await (await rawBlob(a, v.portada.sha)).blob()], { type: mime(v.portada.path) });
        const pn = pre + '_portada.' + v.portada.path.split('.').pop().toLowerCase();
        await idbPut(pk(a, v), { blob: pb, name: pn }); mem.set(pk(a, v), { blob: pb, name: pn }); S.local.add(pk(a, v));
      }
      toast('Listo: vídeo y portada en el móvil ✓');
    } else S.autoplay = k;
  } catch (e) {
    toast((guardar ? 'Error al descargar: ' : 'No se pudo cargar el vídeo: ') + e.message, true);
  }
  delete S.progress[k]; render();
}

function updProgress(k, pc) {
  const b = document.getElementById('pb-' + cssid(k)), t = document.getElementById('pt-' + cssid(k));
  if (b) b.style.width = (pc * 100).toFixed(1) + '%';
  if (t) t.textContent = `Descargando… ${Math.round(pc * 100)}%`;
}

async function share(k, what) {
  const m = mem.get(k);
  if (!m) { toast('Aún no está en el móvil. Descárgalo primero.', true); return; }
  const file = new File([m.blob], m.name, { type: m.blob.type });
  const bajar = () => {
    const u = URL.createObjectURL(m.blob);
    const l = document.createElement('a'); l.href = u; l.download = m.name; document.body.appendChild(l); l.click(); l.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
  };
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); }
    catch (e) {
      if (e.name === 'AbortError') return;
      if (e.name === 'NotAllowedError' && m.blob.size > 49 * 1048576) {
        // Chrome en Android no deja compartir archivos de más de 50 MB: se guarda en Descargas
        bajar();
        toast(`${what} de ${mb(m.blob.size)}: demasiado grande para compartir. Guardado en Descargas (bórralo al publicar).`, true);
      } else toast('No se pudo compartir: ' + e.message, true);
    }
  } else {
    const u = URL.createObjectURL(m.blob);
    const l = document.createElement('a'); l.href = u; l.download = m.name; document.body.appendChild(l); l.click(); l.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
    toast(what + ' guardado en Descargas');
  }
}

async function quitarLocal(v, silent) {
  const a = acc();
  for (const k of [vk(a, v), pk(a, v)]) { try { await idbDel(k); } catch {} dropMem(k); S.local.delete(k); }
  if (!silent) toast('Copia borrada del móvil');
  render();
}

async function setPosted(v, p, on) {
  const a = acc(); const bk = v.id + '|' + p;
  if (S.busy[bk]) return;
  S.busy[bk] = true; render();
  try {
    for (let i = 0; i < 3; i++) {
      const { sha, data } = await getEstado(a);
      const ent = data.videos[v.id] || (data.videos[v.id] = {});
      if (on) ent[p] = new Date().toISOString(); else delete ent[p];
      if (!Object.keys(ent).length) delete data.videos[v.id];
      data.actualizado = new Date().toISOString();
      try {
        await gh(a, `${rp(a)}/contents/${encPath(estadoPath(a))}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `${on ? 'Publicado' : 'Desmarcado'}: ${v.id} en ${PLAT[p].n}`, content: b64(JSON.stringify(data, null, 2) + '\n'), branch: branch(a), ...(sha ? { sha } : {}) })
        });
        S.estado = data; break;
      } catch (e) {
        if ((e.status === 409 || e.status === 422) && i < 2) continue;
        throw e;
      }
    }
    if (on && done(v)) {
      const hadLocal = S.local.has(vk(a, v));
      await quitarLocal(v, true);
      toast(hadLocal ? '¡Publicado en todo! Copia borrada del móvil 🧹' : '¡Publicado en todo! ✓');
      if (S.detail === v.id && S.tab === 'next') S.detail = null;
    } else toast(on ? `Marcado como publicado en ${PLAT[p].n}` : `Desmarcado de ${PLAT[p].n}`);
  } catch (e) {
    toast('No se pudo guardar: ' + e.message, true);
  }
  delete S.busy[bk]; render();
}

async function copy(txt) {
  try { await navigator.clipboard.writeText(txt); }
  catch {
    const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length); document.execCommand('copy'); ta.remove();
  }
  toast('Pie copiado ✓');
}

/* =================== Miniaturas =================== */
function thumb(a, v) {
  if (!v.portada) return null;
  const local = mem.get(pk(a, v));
  const key = v.portada.sha;
  const t = thumbs.get(key);
  if (t && t !== 'loading' && t !== 'error') return t;
  if (!t && local) { const u = URL.createObjectURL(local.blob); thumbs.set(key, u); return u; }
  if (!t) { thumbs.set(key, 'loading'); thumbQ.push({ a, sha: key, type: mime(v.portada.path) }); pumpThumbs(); }
  return null;
}
function pumpThumbs() {
  while (thumbActive < 4 && thumbQ.length) {
    const j = thumbQ.shift(); thumbActive++;
    rawBlob(j.a, j.sha).then(r => r.blob()).then(b => { thumbs.set(j.sha, URL.createObjectURL(new Blob([b], { type: j.type }))); })
      .catch(() => thumbs.set(j.sha, 'error'))
      .finally(() => { thumbActive--; scheduleRender(); pumpThumbs(); });
  }
}

/* =================== Render =================== */
let rq;
function scheduleRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = null; render(); }); }

function render() {
  const a = acc();
  $('#accs').innerHTML = accounts.length
    ? accounts.map(x => `<button class="chip ${x.id === cur ? 'on' : ''}" style="--c:${x.color}" data-act="acc" data-id="${esc(x.id)}">${esc(x.nombre)}</button>`).join('')
    : `<b style="padding:8px 2px">Cola de vídeos</b>`;
  $('#btnRefresh').classList.toggle('spin', S.loading);
  const pend = S.videos.filter(v => !done(v));
  const hechos = S.videos.filter(done);
  $('#tabs').innerHTML = !a ? '' : [['next', 'Siguiente', ''], ['cola', 'Cola', pend.length], ['hechos', 'Publicados', hechos.length]]
    .map(([k, n, c]) => `<button class="tab ${S.tab === k && !S.detail ? 'on' : ''}" data-act="tab" data-id="${k}">${n} ${c !== '' ? `<small>${c}</small>` : ''}</button>`).join('');

  let h = '';
  if (!a) {
    h = `<div class="empty"><div class="big">🎬</div><h3>Añade tu primera cuenta</h3><p>Conecta el repo de GitHub donde tu chat sube los vídeos. Puedes añadir varias cuentas y cambiar entre ellas arriba.</p><button class="btn primary" data-act="newacc">➕ Añadir cuenta</button></div>`;
  } else {
    if (S.error) h += `<div class="errbox"><p>⚠️ ${esc(S.error)}</p><div class="row"><button class="btn" data-act="refresh">Reintentar</button><button class="btn" data-act="settings">Revisar ajustes</button></div></div>`;
    if (S.loading && S.loadedFor !== a.id) h += `<div class="spinner">Cargando vídeos de ${esc(a.nombre)}…</div>`;
    else if (S.loadedFor === a.id) {
      if (S.detail) {
        const v = findV(S.detail);
        h += `<button class="back" data-act="back">← Volver</button>` + (v ? card(v) : '<div class="empty">Este vídeo ya no está en el repo.</div>');
      } else if (S.tab === 'next') {
        if (pend.length) h += card(pend[0]) + (pend.length > 1 ? `<div class="more">Después de este quedan ${pend.length - 1} en la cola</div>` : `<div class="more">Es el último de la cola</div>`);
        else h += `<div class="empty"><div class="big">🎉</div><h3>¡Al día!</h3><p>No hay vídeos pendientes en <b>${esc(a.nombre)}</b>. Cuando el chat suba uno nuevo aparecerá aquí.</p></div>`;
      } else if (S.tab === 'cola') {
        h += pend.length ? list(pend) : `<div class="empty"><div class="big">📭</div><h3>Cola vacía</h3></div>`;
      } else {
        const last = v => Math.max(...v.plataformas.map(p => +new Date(S.estado.videos[v.id]?.[p] || 0)));
        h += hechos.length ? list([...hechos].sort((x, y) => last(y) - last(x))) : `<div class="empty"><div class="big">🗂️</div><h3>Aún no has publicado nada</h3><p>Aquí quedarán todos los vídeos publicados, para volver a descargarlos cuando quieras.</p></div>`;
      }
    }
  }
  // Conserva los reproductores que ya están en pantalla para no cortar el vídeo al refrescar
  const keep = {};
  document.querySelectorAll('#view video[data-k]').forEach(el => keep[el.dataset.k] = el);
  $('#view').innerHTML = h;
  document.querySelectorAll('#view video[data-k]').forEach(n => { const old = keep[n.dataset.k]; if (old && old.getAttribute('src') === n.getAttribute('src')) n.replaceWith(old); });
  if (S.autoplay) {
    const el = document.querySelector(`#view video[data-k="${CSS.escape(S.autoplay)}"]`);
    S.autoplay = null;
    if (el) el.play().catch(() => {});
  }
}

function card(v) {
  const a = acc(); const k = vk(a, v), kp = pk(a, v);
  const local = S.local.has(k); const prog = S.progress[k];
  if (local && !mem.has(k)) loadMem(k);
  if (S.local.has(kp) && !mem.has(kp)) loadMem(kp);
  const th = thumb(a, v);
  const est = S.estado.videos[v.id] || {};
  const id = esc(v.id);
  const playable = mem.has(k);
  const progBar = `<div class="prog"><div class="bar" id="pb-${cssid(k)}" style="width:${((prog || 0) * 100).toFixed(1)}%"></div><span id="pt-${cssid(k)}">${S.progMode === 'ver' ? 'Cargando' : 'Descargando'}… ${Math.round((prog || 0) * 100)}%</span></div>`;
  let cover;
  if (playable) cover = `<video data-k="${esc(k)}" src="${vurl(k)}" controls playsinline preload="metadata"${th ? ` poster="${th}"` : ''}></video>`;
  else cover = (th ? `<img src="${th}" alt="Portada">` : `<div class="noimg">${v.portada ? 'Cargando portada…' : 'Sin portada'}</div>`)
    + (prog != null && S.progMode === 'ver' ? progBar : prog == null ? `<button class="play" data-act="ver" data-id="${esc(v.id)}" aria-label="Reproducir">▶</button>` : '');
  let actions;
  if (prog != null && S.progMode === 'ver') actions = `<button class="btn primary" disabled>Cargando vídeo para verlo…</button>`;
  else if (prog != null) actions = `<div class="prog"><div class="bar" id="pb-${cssid(k)}" style="width:${(prog * 100).toFixed(1)}%"></div><span id="pt-${cssid(k)}">Descargando… ${Math.round(prog * 100)}%</span></div>`;
  else if (local) actions = `<button class="btn primary" data-act="sharev" data-id="${id}">📤 Compartir vídeo</button>`
    + (v.portada ? `<button class="btn" data-act="sharep" data-id="${id}">🖼️ Guardar / compartir portada</button>` : '')
    + `<button class="btn ghost small danger" data-act="rmlocal" data-id="${id}">🗑️ Quitar del móvil</button>`;
  else if (playable) actions = `<button class="btn primary" data-act="dl" data-id="${id}">⬇️ Guardar en el móvil para publicarlo</button>`;
  else actions = `<button class="btn primary" data-act="dl" data-id="${id}">⬇️ Descargar vídeo${v.portada ? ' y portada' : ''} · ${mb(v.video.size)}</button>`;
  return `<article class="card">
    <div class="cover">${cover}${local && !playable ? '<span class="badge">📱 En el móvil</span>' : ''}</div>
    <h2>${esc(v.titulo)}</h2>
    <div class="meta">${id} · ${mb(v.video.size)}${v.creado ? ' · subido ' + esc(fecha(v.creado)) : ''}</div>
    ${v.notas ? `<p class="notas">${esc(v.notas)}</p>` : ''}${v.err ? `<p class="err">${esc(v.err)}</p>` : ''}
    <div class="actions">${actions}</div>
    ${local ? '<p class="tip">💡 En <b>Compartir vídeo</b> elige directamente Instagram o TikTok: así no se guarda en tu galería. Cuando lo marques como publicado en todas, la copia se borra sola.</p>' : ''}
    ${v.plataformas.map(p => platBlock(v, p, est[p])).join('')}
  </article>`;
}

function platBlock(v, p, when) {
  const busy = S.busy[v.id + '|' + p]; const id = esc(v.id); const pie = v.pies[p];
  return `<section class="plat ${when ? 'ok' : ''}" style="--pc:${PLAT[p].c}">
    <div class="ph"><b>${PLAT[p].n}</b>${when ? `<span class="okt">✓ Publicado ${esc(fecha(when))}</span>` : ''}</div>
    <div class="pie">${pie ? esc(pie) : '<i style="color:var(--mut)">Sin pie de foto</i>'}</div>
    <div class="row">
      <button class="btn" data-act="copy" data-id="${id}" data-p="${p}" ${pie ? '' : 'disabled'}>📋 Copiar pie</button>
      ${when ? `<button class="btn ghost" data-act="unmark" data-id="${id}" data-p="${p}" ${busy ? 'disabled' : ''}>${busy ? 'Guardando…' : '↩️ Deshacer'}</button>`
             : `<button class="btn ok" data-act="mark" data-id="${id}" data-p="${p}" ${busy ? 'disabled' : ''}>${busy ? 'Guardando…' : '✅ Publicado'}</button>`}
    </div>
  </section>`;
}

function list(vs) {
  const a = acc();
  return `<div class="list">${vs.map(v => {
    const th = thumb(a, v); const est = S.estado.videos[v.id] || {};
    return `<button class="item" data-act="open" data-id="${esc(v.id)}">
      <div class="th">${th ? `<img src="${th}" alt="">` : ''}</div>
      <div class="it"><b>${esc(v.titulo)}</b><small>${esc(v.id)} · ${mb(v.video.size)}</small>
        <span class="pls">${v.plataformas.map(p => `<span class="pl ${est[p] ? 'on' : ''}" style="--pc:${PLAT[p].c}">${PLAT[p].n}${est[p] ? ' ✓' : ''}</span>`).join('')}</span></div>
      ${S.local.has(vk(a, v)) ? '<span title="En el móvil">📱</span>' : ''}
    </button>`;
  }).join('')}</div>`;
}

/* =================== Ajustes / cuentas =================== */
let editing = null, testMsg = null;
function openSettings(edit) {
  editing = edit === undefined ? null : edit; testMsg = null;
  renderSettings();
  const d = $('#dlg'); if (!d.open) d.showModal();
}
async function renderSettings() {
  const b = $('#dlgBody');
  if (editing) {
    const e = editing;
    b.innerHTML = `<div class="dh"><h3>${e.id ? 'Editar cuenta' : 'Nueva cuenta'}</h3><button class="icon" data-act="closedlg">✕</button></div>
    <div class="sec">
      <label>Nombre de la cuenta</label><input id="f-nombre" value="${esc(e.nombre || '')}" placeholder="p. ej. @micuenta_1">
      <label>Color</label><div class="colors">${COLORS.map(c => `<button style="background:${c}" class="${(e.color || COLORS[0]) === c ? 'on' : ''}" data-act="color" data-id="${c}"></button>`).join('')}</div>
      <label>Usuario u organización de GitHub</label><input id="f-owner" value="${esc(e.owner || '')}" placeholder="tu-usuario" autocapitalize="off" autocorrect="off">
      <label>Repositorio</label><input id="f-repo" value="${esc(e.repo || '')}" placeholder="videos-cuenta-1" autocapitalize="off" autocorrect="off">
      <label>Rama</label><input id="f-rama" value="${esc(e.rama || 'main')}" autocapitalize="off" autocorrect="off">
      <label>Carpeta dentro del repo (opcional)</label><input id="f-carpeta" value="${esc(e.carpeta || '')}" placeholder="vacío = raíz del repo" autocapitalize="off" autocorrect="off">
      <div class="help">Solo si usas un mismo repo para varias cuentas (p. ej. <code>cuenta1</code>). La app busca <code>videos/</code> y <code>estado.json</code> dentro.</div>
      <label>Token de GitHub</label><input id="f-token" type="password" value="${esc(e.token || '')}" placeholder="github_pat_…" autocapitalize="off" autocorrect="off">
      <div class="help">GitHub → Settings → Developer settings → Fine-grained tokens → acceso solo a este repo, permiso <b>Contents: Read and write</b>. Se guarda solo en este móvil.</div>
      ${testMsg ? `<div class="msg ${testMsg.ok ? 'ok' : 'bad'}">${esc(testMsg.t)}</div>` : ''}
    </div>
    <div class="actions">
      <button class="btn" data-act="testacc">🔌 Probar conexión</button>
      <button class="btn primary" data-act="saveacc">Guardar cuenta</button>
      <button class="btn ghost" data-act="settings">Cancelar</button>
      ${e.id ? '<button class="btn ghost danger" data-act="delacc">Quitar cuenta de la app</button>' : ''}
    </div>`;
    return;
  }
  let usage = '';
  try { const est = await navigator.storage.estimate(); usage = mb(est.usage) || '0 MB'; } catch {}
  b.innerHTML = `<div class="dh"><h3>Ajustes</h3><button class="icon" data-act="closedlg">✕</button></div>
  <div class="sec"><h4>Cuentas</h4>
    ${accounts.map(x => `<div class="accrow"><span class="dot" style="background:${x.color}"></span><div class="nm"><b>${esc(x.nombre)}</b><small>${esc(x.owner)}/${esc(x.repo)}${x.carpeta ? '/' + esc(x.carpeta) : ''}</small></div>
      <button class="btn small" style="width:auto" data-act="editacc" data-id="${esc(x.id)}">Editar</button></div>`).join('') || '<p style="color:var(--mut)">Todavía no hay cuentas.</p>'}
    <div class="actions"><button class="btn primary" data-act="newacc">➕ Añadir cuenta</button></div>
  </div>
  <div class="sec"><h4>Espacio en el móvil</h4>
    <p style="margin:0 0 10px;color:var(--mut);font-size:14px">La app ocupa ahora ${usage || 'poco'} (vídeos descargados y aún no publicados). Los vídeos siguen siempre en GitHub.</p>
    <button class="btn danger" data-act="wipe">🧹 Borrar todas las copias del móvil</button>
  </div>
  <p class="help" style="text-align:center">Cola de vídeos · los datos de las cuentas se guardan solo en este dispositivo</p>`;
}
function readForm() {
  const g = id => $('#f-' + id).value.trim();
  Object.assign(editing, { nombre: g('nombre'), owner: g('owner').replace(/^https?:\/\/github\.com\//, '').split('/')[0], repo: g('repo').replace(/\.git$/, '').split('/').pop(), rama: g('rama') || 'main', carpeta: g('carpeta'), token: g('token') });
  if (!editing.color) editing.color = COLORS[accounts.length % COLORS.length];
}
async function testAcc() {
  readForm(); const e = editing;
  if (!e.owner || !e.repo || !e.token) { testMsg = { ok: false, t: 'Rellena usuario, repo y token.' }; renderSettings(); return; }
  testMsg = { ok: true, t: 'Probando…' }; renderSettings();
  try {
    const r = await (await gh(e, rp(e))).json();
    if (r.permissions && !r.permissions.push) throw new Error('El token puede leer pero no escribir: dale permiso Contents: Read and write.');
    const vids = await loadVideos(e);
    testMsg = { ok: true, t: `✓ Conectado a ${r.full_name}${r.private ? ' (privado)' : ''}. Vídeos encontrados: ${vids.length}.` };
  } catch (err) { testMsg = { ok: false, t: '✗ ' + err.message }; }
  renderSettings();
}
function saveAcc() {
  readForm(); const e = editing;
  if (!e.nombre || !e.owner || !e.repo || !e.token) { testMsg = { ok: false, t: 'Faltan datos: nombre, usuario, repo y token son obligatorios.' }; renderSettings(); return; }
  if (!e.id) { e.id = 'a' + Date.now().toString(36); accounts.push(e); }
  else accounts = accounts.map(x => x.id === e.id ? e : x);
  ls.set('cv.accounts', accounts);
  $('#dlg').close();
  const was = cur; cur = e.id; ls.set('cv.current', cur);
  S.videos = []; S.detail = null; S.loadedFor = null; S.tab = 'next';
  refresh();
  if (was !== cur) toast('Cuenta guardada');
}
async function delAcc() {
  const e = editing;
  if (!e?.id || !confirm(`¿Quitar la cuenta "${e.nombre}" de la app? (No se borra nada de GitHub)`)) return;
  try { for (const k of await idbKeys()) if (String(k).startsWith(e.id + '|')) await idbDel(k); } catch {}
  accounts = accounts.filter(x => x.id !== e.id); ls.set('cv.accounts', accounts);
  if (cur === e.id) { cur = accounts[0]?.id || null; ls.set('cv.current', cur); S.videos = []; S.loadedFor = null; S.detail = null; refresh(); }
  editing = null; renderSettings(); render();
}

/* =================== Eventos =================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id, p = t.dataset.p;
  const v = id ? findV(id) : null; const a = acc();
  switch (act) {
    case 'acc': switchAcc(id); break;
    case 'refresh': refresh(); break;
    case 'tab': S.tab = id; S.detail = null; render(); window.scrollTo(0, 0); break;
    case 'open': S.detail = id; render(); window.scrollTo(0, 0); break;
    case 'back': S.detail = null; render(); break;
    case 'dl': if (v) descargar(v); break;
    case 'ver': if (v) descargar(v, false); break;
    case 'sharev': if (v) share(vk(a, v), 'Vídeo'); break;
    case 'sharep': if (v) share(pk(a, v), 'Portada'); break;
    case 'rmlocal': if (v) quitarLocal(v); break;
    case 'copy': if (v) copy(v.pies[p]); break;
    case 'mark': if (v) setPosted(v, p, true); break;
    case 'unmark': if (v) setPosted(v, p, false); break;
    case 'settings': openSettings(); break;
    case 'closedlg': $('#dlg').close(); break;
    case 'newacc': openSettings({ rama: 'main', color: COLORS[accounts.length % COLORS.length] }); break;
    case 'editacc': openSettings({ ...accounts.find(x => x.id === id) }); break;
    case 'color': readForm(); editing.color = id; renderSettings(); break;
    case 'testacc': testAcc(); break;
    case 'saveacc': saveAcc(); break;
    case 'delacc': delAcc(); break;
    case 'wipe': (async () => {
        if (!confirm('¿Borrar todas las copias descargadas en el móvil? Siguen disponibles en GitHub.')) return;
        try { for (const k of await idbKeys()) await idbDel(k); } catch {}
        [...mem.keys()].forEach(dropMem); S.local.clear(); toast('Copias borradas'); renderSettings(); render();
      })(); break;
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && acc() && Date.now() - lastRefresh > 15000 && !Object.keys(S.progress).length) refresh();
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

render();
refresh();
</script>
